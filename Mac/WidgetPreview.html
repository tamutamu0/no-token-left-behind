<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; img-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">
<style>
* { box-sizing: border-box; }
html, body, #preview { width: 100%; height: 100%; margin: 0; overflow: hidden; }
body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; user-select: none; }
.widget { width: 100%; height: 100%; border-radius: 24px; }
.text { white-space: nowrap; line-height: 1.18; flex-shrink: 0; font-variant-numeric: tabular-nums; }
i { display: block; }
</style>
</head>
<body><main id="preview" aria-label="Widget preview"></main>
<script>
// A local adapter for Scriptable's layout primitives. No network or file APIs.
class Stack {
  constructor(type = 'stack') { this.type = type; this.children = []; this.direction = 'row'; }
  addStack() { const child = new Stack(); this.children.push(child); return child; }
  addText(value) { const child = { type: 'text', value }; this.children.push(child); return child; }
  addImage(img) { const child = { type: 'image', img }; this.children.push(child); return child; }
  addSpacer(value) { this.children.push({ type: 'spacer', value }); }
  layoutHorizontally() { this.direction = 'row'; }
  layoutVertically() { this.direction = 'column'; }
  centerAlignContent() { this.center = true; }
  bottomAlignContent() { this.bottom = true; }
  setPadding(...values) { this.padding = values; }
}
class ListWidget extends Stack { constructor() { super('widget'); this.direction = 'column'; } }
class Color { constructor(hex, alpha = 1) { this.hex = hex; this.alpha = alpha; } static dynamic(light, dark) { return { light, dark }; } }
class Point { constructor(x, y) { this.x = x; this.y = y; } }
class Rect { constructor(x, y, width, height) { Object.assign(this, { x, y, width, height }); } }
class Path { constructor() { this.points = []; } addLines(points) { this.points.push(...points); } }
// Records drawing operations; previewMarkup turns them into inline SVG (no img-src needed).
class DrawContext {
  constructor() { this.ops = []; this.lineWidth = 1; this.align = 'left'; }
  setLineWidth(w) { this.lineWidth = w; } setStrokeColor(c) { this.stroke = c; }
  addPath(p) { this.path = p; } strokePath() { this.ops.push({ kind: 'path', points: this.path.points, color: this.stroke, width: this.lineWidth }); }
  setTextAlignedCenter() { this.align = 'center'; } setFont(f) { this.font = f; } setTextColor(c) { this.fill = c; }
  drawTextInRect(text, rect) { this.ops.push({ kind: 'text', text, rect, font: this.font, color: this.fill, align: this.align }); }
  getImage() { return { drawing: true, size: this.size, ops: this.ops }; }
}
class Size { constructor(width, height) { this.width = width; this.height = height; } }
const previewFont = (size, weight = 400, rounded = false) => ({ size, weight, rounded });
const Font = { systemFont: n => previewFont(n), semiboldSystemFont: n => previewFont(n, 600),
  semiboldRoundedSystemFont: n => previewFont(n, 600, true) };
const Script = { name: () => 'AI Usage' };
/*WIDGET_SCRIPT*/

const escapePreviewText = value => String(value).replace(/[&<>"']/g,
  c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function previewMarkup(node, appearance, parentDirection = 'column') {
  const color = c => { const v = c[appearance] || c; if (v.alpha != null && v.alpha < 1) {
    const n = parseInt(v.hex, 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${v.alpha})`; } return '#' + v.hex; };
  const drawing = (img, w, h, style) => {
    const body = img.ops.map(op => op.kind === 'path'
      ? `<polyline fill="none" stroke-linecap="round" stroke="${color(op.color)}" stroke-width="${op.width}" points="${op.points.map(p => p.x.toFixed(2) + ',' + p.y.toFixed(2)).join(' ')}"/>`
      : `<text x="${op.align === 'center' ? op.rect.x + op.rect.width / 2 : op.rect.x}" y="${op.rect.y + op.rect.height * 0.8}" text-anchor="${op.align === 'center' ? 'middle' : 'start'}" font-size="${op.font.size}" font-weight="${op.font.weight}" fill="${color(op.color)}" font-family="${op.font.rounded ? 'ui-rounded,' : ''}-apple-system,BlinkMacSystemFont,sans-serif">${escapePreviewText(op.text)}</text>`).join('');
    return `<svg width="${w}" height="${h}" viewBox="0 0 ${img.size.width} ${img.size.height}" style="${style}">${body}</svg>`;
  };
  if (node.type === 'image') {
    const { size } = node.img;
    return drawing(node.img, node.imageSize?.width || size.width, node.imageSize?.height || size.height, 'flex-shrink:0;display:block');
  }
  if (node.type === 'text') {
    return `<span class="text" style="font-size:${node.font.size}px;font-weight:${node.font.weight};color:${color(node.textColor)};font-family:${node.font.rounded ? 'ui-rounded,' : ''}-apple-system,BlinkMacSystemFont,sans-serif">${escapePreviewText(node.value)}</span>`;
  }
  if (node.type === 'spacer') {
    // A flexible spacer keeps SwiftUI's default minimum length (about 8 pt) on a device.
    return `<i style="${node.value == null ? `flex:1;${parentDirection === 'row' ? 'min-width:8px;min-height:0' : 'min-height:8px;min-width:0'}` : `flex:none;${parentDirection === 'row' ? 'width' : 'height'}:${node.value}px`}"></i>`;
  }
  const styles = [`display:flex;flex-direction:${node.direction}`, `align-items:${node.center ? 'center' : node.bottom ? 'baseline' : 'stretch'}`, 'flex-shrink:0', ...(node.size?.width > 0 || node.size?.height > 0 ? ['overflow:hidden'] : [])];
  if (node.padding) styles.push(`padding:${node.padding.map(v => v + 'px').join(' ')}`);
  // Like Scriptable on a device: a stack without a fixed width fills its parent — across a row,
  // and the full width of a column — and its own content starts at the leading edge. A stack
  // with a fixed width inside a column sits at the leading edge too, whatever the alignment.
  if (node.size?.width > 0) styles.push(`width:${node.size.width}px`, ...(parentDirection === 'column' ? ['align-self:flex-start'] : []));
  else if (parentDirection === 'row') styles.push('flex:1;min-width:0');
  else styles.push('align-self:stretch');
  if (node.size?.height > 0) styles.push(`height:${node.size.height}px`);
  if (node.backgroundColor) styles.push('background:' + color(node.backgroundColor));
  if (node.cornerRadius) styles.push('border-radius:' + node.cornerRadius + 'px');
  // A stack's backgroundImage is stretched behind its content, like Scriptable does.
  const backdrop = node.backgroundImage ? drawing(node.backgroundImage, '100%', '100%', 'position:absolute;left:0;top:0;z-index:-1;pointer-events:none') : '';
  if (backdrop) styles.push('position:relative;isolation:isolate');
  return `<div class="${node.type}" style="${styles.join(';')}">${backdrop}${node.children.map(child => previewMarkup(child, appearance, node.direction)).join('')}</div>`;
}

window.renderUsagePreview = (raw, family, appearance, now, language = 'en', style = 'rings') => {
  const preview = document.getElementById('preview');
  try {
    if (!['small', 'medium', 'large'].includes(family) || !['light', 'dark'].includes(appearance) || !STYLES.includes(style)) throw new Error('Invalid preview');
    setLanguage(language);
    const snapshot = normalizeSnapshot(raw, now);
    preview.innerHTML = previewMarkup(buildWidget(snapshot, '', family, now, '', null, style), appearance);
    return { ok: true, family, appearance, style };
  } catch (_) {
    preview.textContent = 'Couldn’t load the preview.';
    return { ok: false };
  }
};
</script></body></html>
