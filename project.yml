name: AIUsage
options:
  developmentLanguage: en
  bundleIdPrefix: jp.local.aiusage
  deploymentTarget:
    iOS: '17.0'
    macOS: '14.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    APP_GROUP: group.jp.local.aiusage
    KEYCHAIN_GROUP: $(AppIdentifierPrefix)jp.local.aiusage.shared
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: '0.2.0'
    CURRENT_PROJECT_VERSION: '2'
targets:
  AIUsage:
    type: application
    platform: iOS
    sources:
      - iOS
      - Shared
      - path: Resources
        buildPhase: resources
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: AI Usage
        UILaunchScreen: {}
        AppGroupIdentifier: $(APP_GROUP)
        SharedKeychainGroup: $(KEYCHAIN_GROUP)
        NSLocalNetworkUsageDescription: Exchanges AI usage numbers between your own Mac and iPhone.
    entitlements:
      path: iOS/AIUsage.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP)]
        keychain-access-groups: [$(KEYCHAIN_GROUP)]
    dependencies:
      - target: UsageWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.local.aiusage.ios
        TARGETED_DEVICE_FAMILY: '1,2'
  UsageWidget:
    type: app-extension
    platform: iOS
    sources:
      - Widget
      - Shared
      - path: Resources
        buildPhase: resources
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: AI Usage
        AppGroupIdentifier: $(APP_GROUP)
        SharedKeychainGroup: $(KEYCHAIN_GROUP)
        NSLocalNetworkUsageDescription: Exchanges AI usage numbers between your own Mac and iPhone.
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/UsageWidget.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP)]
        keychain-access-groups: [$(KEYCHAIN_GROUP)]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.local.aiusage.ios.widget
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
  AIUsageMac:
    type: application
    platform: macOS
    sources:
      - Mac
      - Shared
      - path: Resources
        buildPhase: resources
      - path: Scriptable
        buildPhase: resources
      - path: Scripts
        buildPhase: resources
        excludes: ["__pycache__"]
    info:
      path: Mac/Info.plist
      properties:
        CFBundleDisplayName: AI Usage
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSLocalNetworkUsageDescription: Exchanges AI usage numbers between your own Mac and iPhone.
        NSHighResolutionCapable: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.local.aiusage.mac
        ENABLE_APP_SANDBOX: NO
schemes:
  AIUsage:
    build:
      targets:
        AIUsage: all
  AIUsageMac:
    build:
      targets:
        AIUsageMac: all
